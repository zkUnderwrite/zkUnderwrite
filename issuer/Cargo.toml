[package]
name = "zku-issuer"
version = "0.1.0"
edition = "2021"
description = "zkUnderwrite issuer service: signs canonical income statements with Ed25519"

[lib]
name = "zku_issuer"
path = "src/lib.rs"

[[bin]]
name = "zku-issuer"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core", "zeroize"] }
rand = "0.8"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
zeroize = "1"
